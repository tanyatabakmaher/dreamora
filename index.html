<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המטרות שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Pastel Atelier design system: light only, Heebo only. Tokens below are the single source of truth. */
:root {
  --color-canvas: #FCF9FD;
  --color-surface: #FFFFFF;
  --color-lavender: #DCCCED;
  --color-pink: #F3C6DA;
  --color-mint: #C9E8DD;
  --color-sky: #CBE5EF;
  --color-butter: #F5E6AC;
  --color-primary: #70508F;
  --color-primary-hover: #5D407A;
  --color-primary-pressed: #4B3265;
  --color-text: #302738;
  --color-text-muted: #685D70;
  --color-border: #DED5E5;
  --color-input-border: #887991;
  --color-focus: #70508F;
  --color-success: #27654E;
  --color-success-bg: #E8F5EE;
  --color-error: #A33454;
  --color-error-bg: #FCEBF0;
  --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px; --space-48: 48px;
  --radius-control: 12px; --radius-card: 20px; --radius-pill: 999px;
  --shadow-card: 0 8px 24px rgba(48, 39, 56, 0.06);
  --font-ui: "Heebo", "Noto Sans Hebrew", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--color-canvas); color: var(--color-text);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; box-shadow: 0 0 0 2px var(--color-surface); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 960px; margin: 0 auto; padding: var(--space-24) var(--space-16) 96px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); margin-bottom: var(--space-32); }
.top h1 { font-weight: 700; font-size: 32px; line-height: 1.25; margin: 0; text-wrap: balance; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8);
  min-height: 44px; min-width: 44px; padding: var(--space-8) var(--space-24); border-radius: var(--radius-control); border: 1px solid transparent;
  background: transparent; font-weight: 500;
}
.btn-primary { background: var(--color-primary); color: var(--color-surface); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-primary:active { background: var(--color-primary-pressed); }
.btn-ghost { border-color: var(--color-primary); background: var(--color-surface); color: var(--color-primary); }
.btn-ghost:hover { background: var(--color-lavender); color: var(--color-text); }
.btn-danger { color: var(--color-error); border-color: var(--color-error); background: var(--color-surface); }
.btn-danger:hover { background: var(--color-error-bg); }
.btn-solid-danger { background: var(--color-error); color: var(--color-surface); }
.btn-solid-danger:hover { filter: brightness(.92); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-24); }

.card {
  position: relative; display: flex; flex-direction: column; gap: var(--space-8);
  background: var(--color-surface); border-radius: var(--radius-card);
  padding: var(--space-16); box-shadow: var(--shadow-card); cursor: pointer;
  transition: transform .15s ease;
}
@media (min-width: 640px) { .card { padding: var(--space-24); } }
.card:hover { transform: translateY(-2px); }
.card.achieved { background: var(--color-mint); box-shadow: none; }
.card-top { display: flex; align-items: center; gap: var(--space-12); min-height: 44px; }
.emoji { flex: none; width: 44px; height: 44px; display: grid; place-items: center; font-size: 26px; border-radius: var(--radius-control); background: var(--color-lavender); }
.card.achieved .emoji { background: var(--color-surface); }
.card h2 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; flex: 1; text-wrap: balance; }
.badge { flex: none; background: var(--color-butter); color: var(--color-text); font-weight: 500; font-size: 14px; line-height: 1.5; padding: var(--space-4) var(--space-12); border-radius: var(--radius-pill); white-space: nowrap; }

.gauge { position: relative; margin: var(--space-4) auto 0; width: 100%; max-width: 250px; }
.gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
.g-track { fill: none; stroke: var(--color-lavender); stroke-width: 9; stroke-linecap: round; }
.card.achieved .g-track { stroke: var(--color-surface); }
.g-fill { fill: none; stroke: var(--color-primary); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .4s ease; }
.card.achieved .g-fill { stroke: var(--color-success); }
.g-tick { stroke: var(--color-text-muted); stroke-width: 1; opacity: .55; }
.g-tick.major { stroke-width: 1.6; opacity: .8; }
.g-dot-ring { fill: var(--color-surface); }
.g-dot { fill: var(--color-primary); }
.card.achieved .g-dot { fill: var(--color-success); }
.gauge-num { position: absolute; inset-inline: 0; bottom: -2px; text-align: center; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -.01em; }
.gauge-num small { font-size: 20px; margin-inline-start: 1px; color: var(--color-text-muted); }
.card.achieved .gauge-num small { color: var(--color-text-muted); }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); margin: var(--space-16) 0 0; padding-top: var(--space-12); border-top: 1px solid var(--color-border); }
.card.achieved .facts { border-top-color: var(--color-surface); }
.facts div { min-width: 0; }
.facts dt { font-size: 14px; font-weight: 500; color: var(--color-text-muted); margin: 0; }
.facts dd { margin: 0; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.edit-hint { position: absolute; top: 14px; inset-inline-end: 14px; display: none; }

.empty { text-align: center; padding: var(--space-32) var(--space-16) var(--space-24); max-width: 420px; margin: 0 auto; }
.empty .gauge { max-width: 190px; margin-bottom: var(--space-16); opacity: .9; }
.empty h2 { font-weight: 700; font-size: 24px; line-height: 1.3; margin: 0 0 var(--space-8); }
.empty p { margin: 0 0 var(--space-24); color: var(--color-text-muted); }

.foot { position: fixed; inset-inline: 0; bottom: 0; z-index: 5; background: var(--color-canvas); border-top: 1px solid var(--color-border); padding: 10px var(--space-16) calc(10px + env(safe-area-inset-bottom)); text-align: center; font-size: 14px; font-weight: 500; color: var(--color-text-muted); }

/* sheet + dialogs */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(48,39,56,.5); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.overlay.center { align-items: center; padding: var(--space-16); }
.sheet { width: 100%; max-width: 520px; max-height: 94vh; overflow-y: auto; background: var(--color-surface); border-radius: var(--radius-card) var(--radius-card) 0 0; padding: var(--space-24) var(--space-16) var(--space-16); box-shadow: var(--shadow-card); }
.overlay.center .sheet { border-radius: var(--radius-card); max-width: 400px; }
@media (min-width: 640px) { .overlay { align-items: center; padding: var(--space-16); } .sheet { border-radius: var(--radius-card); padding: var(--space-24); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); margin-bottom: var(--space-16); }
.sheet-head h2 { margin: 0; font-weight: 700; font-size: 24px; line-height: 1.3; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--radius-control); border: 1px solid var(--color-input-border); background: var(--color-surface); font-size: 18px; line-height: 1; }
.field { display: flex; flex-direction: column; gap: var(--space-8); margin-bottom: var(--space-16); }
.field > label, .field > .lbl { font-weight: 500; font-size: 14px; line-height: 1.5; }
.input { width: 100%; min-height: 44px; padding: var(--space-8) var(--space-16); border: 1px solid var(--color-input-border); border-radius: var(--radius-control); background: var(--color-surface); }
.input:focus { border-color: var(--color-primary); }
.field.invalid .input { border-color: var(--color-error); }
.err { color: var(--color-error); font-size: 14px; font-weight: 500; min-height: 0; }
.hint { color: var(--color-text-muted); font-size: 14px; font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.emoji-row { display: flex; flex-wrap: wrap; gap: var(--space-8); }
.emoji-opt { position: relative; width: 46px; height: 46px; border-radius: var(--radius-control); border: 1px solid var(--color-input-border); background: var(--color-surface); font-size: 24px; display: grid; place-items: center; }
.emoji-opt[aria-pressed="true"] { border: 2px solid var(--color-primary); background: var(--color-lavender); }
.emoji-opt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: -6px; inset-inline-end: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--color-primary); color: var(--color-surface); font-size: 12px; line-height: 18px; text-align: center; }
.emoji img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
.img-row { display: flex; align-items: center; gap: var(--space-12); margin-top: var(--space-4); flex-wrap: wrap; }
.img-preview { width: 46px; height: 46px; border-radius: var(--radius-control); overflow: hidden; border: 2px solid var(--color-primary); background: var(--color-lavender); }
.img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-row .btn { min-height: 44px; }
.summary { border-radius: var(--radius-control); padding: var(--space-12) var(--space-16); margin: var(--space-4) 0 var(--space-16); background: var(--color-lavender); min-height: 20px; color: var(--color-text); }
.summary.ok { background: var(--color-lavender); }
.summary.bad { background: var(--color-error-bg); color: var(--color-error); }
.summary h3 { margin: 0 0 var(--space-4); font-size: 14px; color: var(--color-text); font-weight: 500; }
.summary p { margin: 0; font-weight: 700; }
.summary .sub { font-weight: 500; color: var(--color-text); margin-top: 2px; }
.summary.bad h3, .summary.bad .sub { color: var(--color-error); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: var(--space-12); justify-content: flex-start; }
.sheet-actions .grow { flex: 1; }
.confirm p { margin: 0 0 var(--space-16); color: var(--color-text-muted); }
.confirm h2 { margin: 0 0 var(--space-8); font-weight: 700; font-size: 24px; line-height: 1.3; }


/* auth screens */
body:not(.authed) .wrap, body:not(.authed) .foot { display: none; }
body.authed #authScreen { display: none; }
#authScreen { min-height: 100vh; max-width: 480px; margin: 0 auto; padding: var(--space-24) var(--space-24) var(--space-32); display: flex; flex-direction: column; }
.auth-brand { display: flex; align-items: center; gap: var(--space-12); }
.auth-brand b { font-size: 24px; line-height: 1.3; font-weight: 700; }
.auth-view { flex: 1; display: flex; flex-direction: column; }
.preview { background: var(--color-lavender); border-radius: var(--radius-card); padding: var(--space-24) var(--space-16); display: flex; flex-direction: column; gap: var(--space-12); align-items: center; }
.pv-card { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: var(--space-16); display: flex; align-items: center; gap: var(--space-12); width: 100%; max-width: 300px; }
.pv-dot { width: 44px; height: 44px; border-radius: var(--radius-control); flex: none; }
.pv-mid { flex: 1; display: flex; flex-direction: column; gap: var(--space-8); font-weight: 700; }
.pv-bar { height: 8px; border-radius: var(--radius-pill); background: var(--color-lavender); }
.pv-bar i { display: block; height: 8px; border-radius: var(--radius-pill); background: var(--color-primary); }
.pv-pct { font-weight: 700; font-size: 20px; }
.auth-mid { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--space-32); padding: var(--space-32) 0; }
.auth-mid h2 { margin: 0 0 var(--space-8); font-size: 32px; line-height: 1.25; font-weight: 700; text-align: center; }
.auth-mid p { margin: 0; text-align: center; color: var(--color-text-muted); }
.auth-actions { display: flex; flex-direction: column; gap: var(--space-12); }
.auth-actions .btn { width: 100%; min-height: 48px; }
.auth-back { align-self: flex-start; margin-top: var(--space-24); }
.auth-form { display: flex; flex-direction: column; gap: var(--space-16); margin-top: var(--space-16); }
.auth-form h2 { margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-left: 76px; padding-right: var(--space-16); }
.pw-toggle { position: absolute; inset-inline-end: 4px; top: 0; min-height: 44px; min-width: 44px; padding: 0 var(--space-12); background: none; border: 0; color: var(--color-primary); font-weight: 500; font-size: 14px; }
.form-msg { border-radius: var(--radius-control); padding: var(--space-12) var(--space-16); font-size: 14px; font-weight: 500; line-height: 1.5; }
.form-msg.err-box { background: var(--color-error-bg); color: var(--color-error); }
.form-msg.info { background: var(--color-sky); color: var(--color-text); }
.swap { margin: 0; text-align: center; }
.linkbtn { background: none; border: 0; padding: 0 var(--space-4); min-height: 44px; color: var(--color-primary); font-weight: 700; text-decoration: underline; }
.or { display: flex; align-items: center; gap: var(--space-12); color: var(--color-text-muted); font-size: 14px; font-weight: 500; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--color-border); }
.alt { display: flex; flex-direction: column; gap: var(--space-12); }
.alt .btn { width: 100%; min-height: 48px; }
.toast { position: fixed; inset-inline: var(--space-16); bottom: 64px; z-index: 30; max-width: 420px; margin: 0 auto; background: var(--color-error-bg); color: var(--color-error); border-radius: var(--radius-control); padding: var(--space-12) var(--space-16); font-size: 14px; font-weight: 500; text-align: center; box-shadow: var(--shadow-card); }
.fine { margin: 0; font-size: 14px; font-weight: 500; color: var(--color-text-muted); text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="authScreen">
  <div class="auth-brand"><svg width="44" height="44" viewBox="0 0 56 56" role="img" aria-label="לוגו יעד"><rect width="56" height="56" rx="16" fill="#DCCCED"/><path d="M12 38 A16 16 0 0 1 44 38" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M12 38 A16 16 0 0 1 32.9 22.8" fill="none" stroke="#70508F" stroke-width="6" stroke-linecap="round"/><circle cx="32.9" cy="22.8" r="5" fill="#FFFFFF"/><circle cx="32.9" cy="22.8" r="3" fill="#70508F"/></svg><b>יעד</b></div>

  <section class="auth-view" id="viewWelcome">
    <div class="auth-mid">
      <div class="preview" aria-hidden="true"><div class="pv-card"><span class="pv-dot" style="background:#F3C6DA"></span><div class="pv-mid"><span>טיול ליפן</span><div class="pv-bar"><i style="width:47%"></i></div></div><span class="pv-pct num">47%</span></div><div class="pv-card"><span class="pv-dot" style="background:#CBE5EF"></span><div class="pv-mid"><span>רכב חדש</span><div class="pv-bar"><i style="width:13%"></i></div></div><span class="pv-pct num">13%</span></div><div class="pv-card"><span class="pv-dot" style="background:#C9E8DD"></span><div class="pv-mid"><span>דירה</span><div class="pv-bar"><i style="width:72%"></i></div></div><span class="pv-pct num">72%</span></div></div>
      <div><h2 id="welcomeTitle" tabindex="-1">כל מטרה, עם תוכנית ברורה</h2><p>רואים כמה נשאר ומתי מגיעים ליעד.</p></div>
    </div>
    <div class="auth-actions">
      <button type="button" class="btn btn-primary" id="goSignup">יצירת חשבון</button>
      <button type="button" class="btn btn-ghost" id="goLogin">התחברות</button>
    </div>
  </section>

  <section class="auth-view" id="viewForm" hidden>
    <button type="button" class="btn btn-ghost auth-back" id="authBack" aria-label="חזרה">→ חזרה</button>
    <form class="auth-form" id="authForm" novalidate>
      <h2 id="authTitle" tabindex="-1"></h2>
      <div class="form-msg info" id="demoNote" hidden>מצב הדגמה: ההתחברות עדיין לא מחוברת לשרת, והנתונים נשמרים רק בדפדפן הזה.</div>
      <div class="field" id="fa-name">
        <label for="au-name">שם</label>
        <input class="input" id="au-name" type="text" autocomplete="name" placeholder="איך לקרוא לך?" maxlength="40">
      </div>
      <div class="field" id="fa-email">
        <label for="au-email">אימייל</label>
        <input class="input" id="au-email" type="email" autocomplete="email" dir="ltr" placeholder="name@example.com">
        <div class="err" id="au-email-err"></div>
      </div>
      <div class="field" id="fa-pw">
        <label for="au-pw">סיסמה</label>
        <div class="pw-wrap">
          <input class="input" id="au-pw" type="password" dir="ltr" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false">הצג</button>
        </div>
        <div class="hint" id="au-pw-hint" hidden>לפחות 8 תווים</div>
        <div class="err" id="au-pw-err"></div>
      </div>
      <div class="form-msg err-box" id="authErr" role="alert" hidden></div>
      <div class="form-msg info" id="authInfo" role="status" hidden></div>
      <button type="submit" class="btn btn-primary" id="authSubmit"></button>
      <div class="or" aria-hidden="true">או</div>
      <div class="alt">
        <button type="button" class="btn btn-ghost" id="googleBtn">המשך עם Google</button>
        <button type="button" class="btn btn-ghost" id="magicBtn">שלחו לי קישור כניסה למייל</button>
      </div>
      <p class="fine" id="authFine" hidden>האפליקציה היא כלי מעקב בלבד ואינה ייעוץ השקעות.</p>
      <p class="swap"><span id="swapText"></span><button type="button" class="linkbtn" id="swapBtn"></button></p>
    </form>
  </section>
</div>
<div class="wrap">
  <header class="top">
    <h1 id="homeTitle"></h1>
    <div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn btn-ghost" id="logoutBtn">יציאה</button><button type="button" class="btn btn-primary" id="addBtn"></button></div>
  </header>
  <main id="main"></main>
</div>
<footer class="foot" id="disclaimer"></footer>
<div class="toast" id="toast" role="status" hidden></div>

<div class="overlay" id="sheetOverlay" hidden>
  <form class="sheet" id="goalForm" novalidate role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="sheet-head">
      <h2 id="formTitle"></h2>
      <button type="button" class="icon-btn" id="closeBtn">✕</button>
    </div>

    <div class="field" id="f-name">
      <label for="in-name" id="l-name"></label>
      <input class="input" id="in-name" type="text" maxlength="40" autocomplete="off">
      <div class="err" id="e-name"></div>
    </div>

    <div class="field">
      <span class="lbl" id="l-emoji"></span>
      <div class="emoji-row" id="emojiRow" role="group" aria-labelledby="l-emoji"></div>
      <div class="img-row">
        <span class="img-preview" id="imgPreview" hidden></span>
        <button type="button" class="btn btn-ghost" id="uploadBtn"></button>
        <button type="button" class="btn btn-danger" id="removeImgBtn" hidden></button>
        <input type="file" id="in-image" accept="image/*" hidden>
      </div>
      <div class="err" id="e-emoji"></div>
    </div>

    <div class="row2">
      <div class="field" id="f-target">
        <label for="in-target" id="l-target"></label>
        <input class="input num" id="in-target" type="number" inputmode="decimal" min="0" step="any">
        <div class="err" id="e-target"></div>
      </div>
      <div class="field" id="f-initial">
        <label for="in-initial" id="l-initial"></label>
        <input class="input num" id="in-initial" type="number" inputmode="decimal" min="0" step="any">
        <div class="err" id="e-initial"></div>
      </div>
    </div>

    <div class="field" id="f-monthly">
      <label for="in-monthly" id="l-monthly"></label>
      <input class="input num" id="in-monthly" type="number" inputmode="decimal" min="0" step="any">
      <div class="err" id="e-monthly"></div>
    </div>

    <div class="row2">
      <div class="field" id="f-track">
        <label for="in-track" id="l-track"></label>
        <select class="input" id="in-track"></select>
      </div>
      <div class="field" id="f-return">
        <label for="in-return" id="l-return"></label>
        <input class="input num" id="in-return" type="number" inputmode="decimal" min="0" max="100" step="any">
        <div class="err" id="e-return"></div>
      </div>
    </div>
    <div class="hint" id="trackHint" style="margin: -6px 0 14px;" hidden></div>

    <div class="field" id="f-start">
      <label for="in-start" id="l-start"></label>
      <input class="input num" id="in-start" type="date">
      <div class="err" id="e-start"></div>
    </div>

    <div class="sheet-actions">

<script>
// calc.js - pure functions, no UI or storage dependencies.
// Monthly compounding, deposits at the end of each month.

function monthlyRate(annualPct) {
  return annualPct / 100 / 12;
}

// Balance after k completed months.
function balanceAfter(P, PMT, annualPct, k) {
  const i = monthlyRate(annualPct);
  if (i === 0) return P + PMT * k;
  const g = Math.pow(1 + i, k);
  return P * g + (PMT * (g - 1)) / i;
}

// Months needed to reach target T. Returns { status, months }.
// status: "achieved" | "ok" | "unreachable" | "tooFar"
function monthsToGoal(T, P, PMT, annualPct) {
  if (P >= T) return { status: "achieved", months: 0 };
  const i = monthlyRate(annualPct);
  let months;
  if (i > 0) {
    const den = P * i + PMT;
    if (den <= 0) return { status: "unreachable", months: null };
    const n = Math.log((T * i + PMT) / den) / Math.log(1 + i);
    months = Math.ceil(n - 1e-9);
  } else {
    if (PMT <= 0) return { status: "unreachable", months: null };
    months = Math.ceil((T - P) / PMT - 1e-9);
  }
  if (months > 600) return { status: "tooFar", months };
  return { status: "ok", months };
}

// Add calendar months; clamp the day to the last day of the target month.
function addMonths(d, n) {
  const m = d.getMonth() + n;
  const ty = d.getFullYear() + Math.floor(m / 12);
  const tm = ((m % 12) + 12) % 12;
  const dim = new Date(ty, tm + 1, 0).getDate();
  return new Date(ty, tm, Math.min(d.getDate(), dim));
}

function parseISODate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function toISODate(d) {
  const p = (x) => String(x).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

// Full calendar months elapsed between start and today (anchored to day of month).
function completedMonths(start, today) {
  let k = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
  if (k < 0) return 0;
  if (today < addMonths(start, k)) k--;
  return Math.max(k, 0);
}

// Everything derived from a goal. Never stored.
function computeGoal(goal, today) {
  const T = goal.targetAmount;
  const P = goal.initialAmount || 0;
  const PMT = goal.monthlyDeposit || 0;
  const r = goal.annualReturnPct || 0;
  const start = parseISODate(goal.startDate);
  const plan = monthsToGoal(T, P, PMT, r);
  const k = completedMonths(start, today);
  const balance = balanceAfter(P, PMT, r, k);
  const achieved = balance >= T;
  const progressPct = achieved ? 100 : Math.min(100, (balance / T) * 100);
  const remaining = Math.max(T - balance, 0);
  const targetDate = plan.months === null ? null : addMonths(start, plan.months);
  return { plan, months: plan.months, targetDate, k, balance, achieved, progressPct, remaining };
}

if (typeof module !== "undefined") {
  module.exports = { monthlyRate, balanceAfter, monthsToGoal, addMonths, parseISODate, toISODate, completedMonths, computeGoal };
}

</script>

      $(ERR[k]).textContent = show ? errs[k] : "";
      $(INPUT[k]).setAttribute("aria-invalid", show ? "true" : "false");
    });
  }

  // Returns { errs, plan } and updates the live summary.
  function refresh() {
    var v = readForm(), errs = validate(v);
    showErrors(errs);
    var box = $("summary"), plan = null;
    var core = !errs.target && !errs.initial && !errs.monthly && !errs.ret && !errs.start;
    box.className = "summary";
    if (!core) { box.innerHTML = '<h3>' + S["summary.title"] + '</h3><p class="sub">—</p>'; return { errs: errs, plan: null }; }
    plan = monthsToGoal(v.target, v.initial, v.monthly, v.ret);
    var start = parseISODate(v.start);
    if (plan.status === "unreachable") { box.className = "summary bad"; box.innerHTML = '<p>' + S["error.unreachable"] + '</p>'; }
    else if (plan.status === "tooFar") { box.className = "summary bad"; box.innerHTML = '<p>' + S["error.tooFar"] + '</p>'; }
    else if (plan.status === "achieved") {
      box.className = "summary ok";
      box.innerHTML = '<h3>' + S["summary.title"] + '</h3><p>' + S["summary.alreadyAchieved"] + '</p>';
    } else {
      box.className = "summary ok";
      box.innerHTML = '<h3>' + S["summary.title"] + '</h3><p>' + S["summary.prefix"] + durText(plan.months) + '</p><p class="sub num">' +
        S["summary.targetDate"] + fmtDate(addMonths(start, plan.months)) + '</p>';
    }
    return { errs: errs, plan: plan };
  }

  form.addEventListener("input", function (ev) {
    var id = ev.target.id;
    Object.keys(INPUT).forEach(function (k) { if (INPUT[k] === id) touched[k] = true; });
    if (id === "in-image") return;
    refresh();
  });
  $("in-track").addEventListener("change", function () {
    state.trackId = this.value;
    var t = trackById(this.value);
    $("in-return").value = t.defaultReturnPct === null ? "" : t.defaultReturnPct;
    touched.ret = false;
    updateTrackHint();
    refresh();
  });
  $("emojiRow").addEventListener("click", function (ev) {
    var b = ev.target.closest(".emoji-opt");
    if (!b) return;
    state.image = null;
    $("e-emoji").textContent = "";
    setEmoji(b.dataset.emoji);
  });
  $("uploadBtn").addEventListener("click", function () { $("in-image").click(); });
  $("removeImgBtn").addEventListener("click", function () { state.image = null; $("in-image").value = ""; $("e-emoji").textContent = ""; updateImageUI(); });
  $("in-image").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { $("e-emoji").textContent = S["error.notImage"]; return; }
    resizeImage(f, function (data) { state.image = data; $("e-emoji").textContent = ""; updateImageUI(); },
      function () { $("e-emoji").textContent = S["error.imageFail"]; });
  });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    attempted = true;
    var r = refresh();
    var keys = Object.keys(r.errs);
    if (keys.length) { var first = ["name", "target", "initial", "monthly", "ret", "start"].find(function (k) { return r.errs[k]; }); $(INPUT[first]).focus(); return; }
    if (!r.plan || r.plan.status === "unreachable" || r.plan.status === "tooFar") { $("summary").scrollIntoView({ block: "nearest" }); return; }
    var v = readForm();
    saveGoal({
      id: state.id, name: v.name, emoji: state.emoji || EMOJI_SUGGESTED[0], image: state.image || null, targetAmount: v.target, initialAmount: v.initial,
      monthlyDeposit: v.monthly, trackId: $("in-track").value, annualReturnPct: v.ret, startDate: v.start, createdAt: state.createdAt
    });
    closeForm();
    render();
  });
  $("closeBtn").addEventListener("click", closeForm);
  $("cancelBtn").addEventListener("click", closeForm);
  overlay.addEventListener("mousedown", function (ev) { if (ev.target === overlay) closeForm(); });

  /* delete confirm */
  var confirmOverlay = $("confirmOverlay");
  $("deleteBtn").addEventListener("click", function () { confirmOverlay.hidden = false; $("confirmNo").focus(); });
  $("confirmNo").addEventListener("click", function () { confirmOverlay.hidden = true; $("deleteBtn").focus(); });
  $("confirmYes").addEventListener("click", function () {
    deleteGoal(state.id);
    confirmOverlay.hidden = true;
    opener = null;
    closeForm();
    render();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    if (!confirmOverlay.hidden) { confirmOverlay.hidden = true; return; }
    if (!overlay.hidden) closeForm();
  });

  /* home interactions */
  $("addBtn").addEventListener("click", function () { openForm(null, this); });
  main.addEventListener("click", function (ev) {
    var add = ev.target.closest('[data-action="add"]');
    if (add) { openForm(null, add); return; }
    var card = ev.target.closest(".card");
    if (card) openForm(getGoals().find(function (g) { return g.id === card.dataset.id; }), card);
  });
  main.addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    var card = ev.target.closest(".card");
    if (card && ev.target === card) { ev.preventDefault(); openForm(getGoals().find(function (g) { return g.id === card.dataset.id; }), card); }
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  /* bridge used by the auth script when goals live on the server */
  window.SavingsApp = {
    useRemote: function (list) { REMOTE = true; mem = (list || []).filter(validGoal); render(); },
    useLocal: function () { REMOTE = false; mem = null; render(); }
  };

  fillStaticText();
  render();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Auth: UI is final; the adapter is swappable. "demo" runs in the browser only (no server, no passwords stored).
   "supabase" is wired for when the app runs on a host that allows network calls (published artifacts block them). */
(function () {
  "use strict";
  var CONFIG = { mode: "supabase", url: "https://ttiwidzjwmojuvvpwodd.supabase.co", key: "sb_publishable_8aDGga3BNbpIe5m_2g9iAQ_QphSu9xq" };
  var SKEY = "savings_demo_session_v1", mem = null;
  function $(id) { return document.getElementById(id); }
  function rd() { try { return localStorage.getItem(SKEY); } catch (e) { return mem; } }
  function wr(v) { try { if (v === null) localStorage.removeItem(SKEY); else localStorage.setItem(SKEY, v); } catch (e) {} mem = v; }

  var demo = {
    getSession: function () { var v = rd(); return Promise.resolve(v ? JSON.parse(v) : null); },
    signUp: function (name, email) { wr(JSON.stringify({ email: email, name: name })); return Promise.resolve({ session: true }); },
    signIn: function (email) { wr(JSON.stringify({ email: email })); return Promise.resolve({ session: true }); },
    signOut: function () { wr(null); return Promise.resolve(); },
    oauth: function () { return Promise.reject({ demo: true }); },
    magic: function () { return Promise.reject({ demo: true }); }
  };
  var sb = null;
  function client() { return sb || (sb = window.supabase.createClient(CONFIG.url, CONFIG.key)); }
  var supa = {
    getSession: function () { return client().auth.getSession().then(function (r) { return r.data.session ? { email: r.data.session.user.email } : null; }); },
    signUp: function (name, email, pw) {
      return client().auth.signUp({ email: email, password: pw, options: { data: { name: name }, emailRedirectTo: window.location.href.split("#")[0] } })
        .then(function (r) { if (r.error) throw r.error; return { session: !!r.data.session }; });
    },
    signIn: function (email, pw) {
      return client().auth.signInWithPassword({ email: email, password: pw })
        .then(function (r) { if (r.error) throw r.error; return { session: true }; });
    },
    signOut: function () { return client().auth.signOut(); },
    oauth: function (provider) {
      return client().auth.signInWithOAuth({ provider: provider, options: { redirectTo: window.location.href.split("#")[0] } })
        .then(function (r) { if (r.error) throw r.error; });
    },
    magic: function (email) {
      return client().auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href.split("#")[0] } })
        .then(function (r) { if (r.error) throw r.error; });
    }
  };
  var auth = CONFIG.mode === "supabase" ? supa : demo;

  /* goals stored per account (RLS on the server limits each user to their own rows) */
  function toRow(g) {
    return { id: g.id, name: g.name, emoji: g.emoji || null, image: g.image || null, target_amount: g.targetAmount, initial_amount: g.initialAmount || 0,
      monthly_deposit: g.monthlyDeposit, track_id: g.trackId, annual_return_pct: g.annualReturnPct, start_date: g.startDate, created_at: g.createdAt || new Date().toISOString() };
  }
  function fromRow(r) {
    return { id: r.id, name: r.name, emoji: r.emoji || "", image: r.image || null, targetAmount: Number(r.target_amount), initialAmount: Number(r.initial_amount),
      monthlyDeposit: Number(r.monthly_deposit), trackId: r.track_id, annualReturnPct: Number(r.annual_return_pct), startDate: r.start_date, createdAt: r.created_at };
  }
  function chk(r) { if (r.error) throw r.error; return r; }
  var remoteApi = {
    load: function () { return client().from("goals").select("*").order("created_at", { ascending: true }).then(function (r) { return chk(r).data.map(fromRow); }); },
    save: function (g) { return client().from("goals").upsert(toRow(g)).then(chk); },
    remove: function (id) { return client().from("goals").delete().eq("id", id).then(chk); }
  };

  var mode = "login";
  var viewWelcome = $("viewWelcome"), viewForm = $("viewForm");
  function enter() {
    if (CONFIG.mode !== "supabase") { document.body.classList.add("authed"); window.scrollTo(0, 0); return Promise.resolve(); }
    window.SavingsRemote = remoteApi;
    return remoteApi.load().then(function (list) { window.SavingsApp.useRemote(list); })
      .catch(function () { window.SavingsApp.useRemote([]); var el = $("toast"); el.textContent = "לא הצלחנו לטעון את המטרות. נסו לרענן."; el.hidden = false; })
      .then(function () { document.body.classList.add("authed"); window.scrollTo(0, 0); });
  }
  function show(which) {
    viewWelcome.hidden = which !== "welcome"; viewForm.hidden = which !== "form";
    if (which === "welcome") $("welcomeTitle").focus(); else $("authTitle").focus();
  }
  function clearMsgs() {
    ["au-email-err", "au-pw-err"].forEach(function (i) { $(i).textContent = ""; });
    ["fa-email", "fa-pw"].forEach(function (i) { $(i).classList.remove("invalid"); });
    $("authErr").hidden = true; $("authInfo").hidden = true;
  }
  function setMode(m) {
    mode = m; clearMsgs();
    var su = m === "signup";
    $("authTitle").textContent = su ? "בואו נתחיל" : "ברוך הבא בחזרה";
    $("authSubmit").textContent = su ? "יצירת חשבון" : "התחברות";
    $("fa-name").hidden = !su; $("au-pw-hint").hidden = !su; $("authFine").hidden = !su;
    $("au-pw").setAttribute("autocomplete", su ? "new-password" : "current-password");
    $("swapText").textContent = su ? "כבר יש לך חשבון?" : "אין לך חשבון?";
    $("swapBtn").textContent = su ? "התחברות" : "יצירת חשבון";
    $("demoNote").hidden = CONFIG.mode !== "demo";
  }
  function open(m) { setMode(m); show("form"); }
  $("goSignup").addEventListener("click", function () { open("signup"); });
  $("goLogin").addEventListener("click", function () { open("login"); });
  $("authBack").addEventListener("click", function () { show("welcome"); });
  $("swapBtn").addEventListener("click", function () { setMode(mode === "login" ? "signup" : "login"); $("authTitle").focus(); });
  $("pwToggle").addEventListener("click", function () {
    var i = $("au-pw"), on = i.type === "password";
    i.type = on ? "text" : "password"; this.textContent = on ? "הסתר" : "הצג"; this.setAttribute("aria-pressed", on ? "true" : "false");
  });

  function fail(id, fid, msg) { $(id).textContent = msg; $(fid).classList.add("invalid"); }
  function friendly(e) {
    var m = (e && e.message || "").toLowerCase();
    if (m.indexOf("invalid login") > -1) return "האימייל או הסיסמה לא נכונים.";
    if (m.indexOf("already") > -1) return "כבר קיים חשבון עם האימייל הזה. אפשר להתחבר.";
    if (m.indexOf("rate") > -1) return "יותר מדי ניסיונות. כדאי לנסות שוב בעוד כמה דקות.";
    return "משהו השתבש. כדאי לנסות שוב.";
  }
  $("authForm").addEventListener("submit", function (ev) {
    ev.preventDefault(); clearMsgs();
    var email = $("au-email").value.trim(), pw = $("au-pw").value, name = $("au-name").value.trim(), ok = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail("au-email-err", "fa-email", "יש להזין כתובת אימייל תקינה."); ok = false; }
    if (!pw) { fail("au-pw-err", "fa-pw", "יש להזין סיסמה."); ok = false; }
    else if (mode === "signup" && pw.length < 8) { fail("au-pw-err", "fa-pw", "הסיסמה צריכה להכיל לפחות 8 תווים."); ok = false; }
    if (!ok) return;
    var btn = $("authSubmit"); btn.disabled = true;
    var p = mode === "signup" ? auth.signUp(name, email, pw) : auth.signIn(email, pw);
    p.then(function (r) {
      if (r && r.session) { $("au-pw").value = ""; enter(); }
      else { var i = $("authInfo"); i.textContent = "שלחנו אליך מייל לאישור. אחרי האישור אפשר להתחבר."; i.hidden = false; }
    }).catch(function (e) { var b = $("authErr"); b.textContent = friendly(e); b.hidden = false; })
      .then(function () { btn.disabled = false; });
  });

  function showInfo(msg) { var i = $("authInfo"); i.textContent = msg; i.hidden = false; }
  function altFail(e) {
    if (e && e.demo) showInfo("האפשרות הזאת תעבוד אחרי שההתחברות תחובר לשרת. כרגע אפשר להמשיך עם אימייל וסיסמה.");
    else { var b = $("authErr"); b.textContent = friendly(e); b.hidden = false; }
  }
  $("googleBtn").addEventListener("click", function () {
    clearMsgs();
    auth.oauth("google").catch(altFail);
  });
  $("magicBtn").addEventListener("click", function () {
    clearMsgs();
    var email = $("au-email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail("au-email-err", "fa-email", "יש להזין כתובת אימייל תקינה."); $("au-email").focus(); return; }
    auth.magic(email).then(function () { showInfo("שלחנו קישור כניסה לאימייל. כדאי לבדוק גם בספאם."); }).catch(altFail);
  });

  $("logoutBtn").addEventListener("click", function () {
    auth.signOut().then(function () {
      document.body.classList.remove("authed");
      window.SavingsRemote = null; window.SavingsApp.useLocal();
      $("authForm").reset(); setMode("login"); show("welcome");
    });
  });

  setMode("login");
  if (/error_code=otp_expired|error=access_denied/.test(window.location.hash)) {
    try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
    var eb = $("authErr"); eb.textContent = "הקישור במייל כבר נוצל או פג תוקפו. אפשר להתחבר, או לבקש קישור חדש."; open("login"); eb.hidden = false;
  }
  auth.getSession().then(function (s) { if (s) enter(); }).catch(function () {});
})();
</script>
